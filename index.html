<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>设计稿预览</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./gate.css">
<script src="./unlock.js" defer></script>
</head>
<body>
<main id="gate">
  <section class="card" aria-labelledby="title">
    <div class="symbol" aria-hidden="true"><span></span></div>
    <h1 id="title">设计稿预览</h1>
    <form id="unlock-form">
      <label for="password">访问密码</label>
      <input id="password" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
      <button id="unlock" type="submit">打开画板</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
    <noscript>请启用 JavaScript 查看画板。</noscript>
  </section>
</main>
</body>
</html>
